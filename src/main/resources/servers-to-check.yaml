commands:
  # ================= SSH-SERVER-1 =================
  - host: "ssh-server-1"
    command: "df -h"
    type: "drive_health"
  - host: "ssh-server-1"
    command: "uptime"
    type: "psu_health"
  - host: "ssh-server-1"
    command: "free -m"
    type: "battery_health"

